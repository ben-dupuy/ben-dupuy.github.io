<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Ben Dupuy</title>
<meta name="description" content="Ben Dupuy — Sports Marketing & Data Analyst.">
<link rel="stylesheet" href="css/organic.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="site-header">
  <nav class="nav" aria-label="Main">
    <a class="nav-brand" href="index.html">Ben Dupuy.</a>
    <div class="nav-links">
      <a href="about.html">About</a>
      <a href="marketing.html">Marketing</a>
      <a href="analytics.html">Analytics</a>
      <a href="blog.html">Blog</a>
      <a class="nav-cta" href="contact.html" aria-current="page">Contact</a>
    </div>
  </nav>
</header>
<main>
<div class="wrap">
  <section class="contact">
    <div class="stack" style="gap:24px">
      <div class="heading-doodle"><h1>Let's talk football data.</h1><img src="doodle-icons/png/black/football-laces-top-black.png" alt=""></div>
      <p class="lead">Hiring for marketing or analytics? I'll reply within a day.</p>
      <div class="ph ph-circle" style="width:160px">Headshot</div>
      <div class="row"><a class="btn btn-secondary" href="#">LinkedIn</a><a class="btn btn-secondary" href="#">GitHub</a><a class="btn btn-secondary" href="#">Résumé PDF</a></div>
    </div>
    <form class="contact-form" action="#" method="post">
      <div class="field"><label for="n">Name</label><input class="input" id="n" name="name" required></div>
      <div class="field"><label for="e">Email</label><input class="input" id="e" name="email" type="email" required></div>
      <div class="field"><label for="o">Organization / team</label><input class="input" id="o" name="org"></div>
      <div class="field"><label for="m">Message</label><textarea class="input" id="m" name="message" required></textarea></div>
      <button class="btn btn-primary btn-block" type="submit">Send</button>
    </form>
  </section>
</div>
</main>
</body>
</html>
